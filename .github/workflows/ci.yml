name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check && uv run ruff format --check
      - name: Tests (no network, no keys)
        run: uv run pytest -q
      - name: Offline demo
        run: uv run python -m job_copilot.demo
