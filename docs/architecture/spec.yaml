- id: load_config
  label: load_config
  sublabel: pydantic validation
  kind: guard
  summary: Loads config.yaml, deep-merges the private config.local.yaml over it, and validates the result with frozen
    pydantic models that reject unknown keys and out-of-range values.
  how:
  - Every model uses extra="forbid" and frozen=True, so a typo or a runtime mutation fails loudly.
  - Thresholds checks both values are 0-100 and that research_min >= digest_min.
  - Limits bounds each cap, e.g. graph_recursion_limit 10-200, daily_model_calls 1-5000, research_timeout_s 30-900.
  - _deep_merge merges mappings key by key; any other value, lists included, replaces the default outright.
  - LangSmith api_url must be the US or EU api.smith.langchain.com URL; workspace_id must be 36 hex-or-dash characters,
    or null.
  rule: limits
