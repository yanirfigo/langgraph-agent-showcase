  how:
  - 'Path: bot.CHECKPOINTS = DEFAULT_DB.with_name("checkpoints.sqlite"), next to ~/.local/share/job-copilot/state.sqlite.'
  - bot.main and run._delivery both build SqliteSaver(sqlite3.connect(CHECKPOINTS, check_same_thread=False)).
  - The run writes threads (offer pauses them at ask); the bot resumes them with Command(resume=action).
  rule: personal data
