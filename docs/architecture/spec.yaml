- id: url_guard
  label: UrlGuard.check
  sublabel: allowlist + public IPs
  kind: guard
  summary: Decides whether a URL may be fetched in this run and returns the IP address it approved. Every redirect
    hop is checked again.
  how:
  - Needs https on port 443 (or no port), no userinfo and no backslash in the netloc; a URL that fails to parse
    raises FetchRefused("malformed URL").
  - 'Allowed: an allowlist domain or its subdomains, the posting''s exact host, an exact web_search URL, or the
    bare homepage (no path, no query) of a host search returned.'
  - 'The host must resolve to at least one IP and every IP must pass _public: is_global and not in 100.64.0.0/10
    (tailnet). IPv4-mapped and 64:ff9b::/96 NAT64 addresses are unwrapped first.'
  - Returns (host, ips[0]); that IP is the one the request connects to.
  rule: untrusted text
  refs:
  - {file: src/job_copilot/tools/web.py, symbol: UrlGuard.check, label: UrlGuard.check()}
  - {file: src/job_copilot/tools/web.py, symbol: UrlGuard._allowed, label: _allowed()}
  - {file: src/job_copilot/tools/web.py, symbol: _public, label: _public()}
  - {file: config/config.yaml, match: 'fetch_allowlist:', label: fetch_allowlist}
- id: pinned_fetcher
  label: SSRF-guarded fetcher
  sublabel: pinned IP, capped body
  kind: guard
  summary: Connects to the IP the guard approved, with SNI and Host set to the real name, and follows redirects
    by hand. Body size and total time are capped.
  how:
  - Follows up to MAX_REDIRECTS=3 redirects; each hop runs guard.check again and gets a timeout of min(remaining,
    15 s).
  - _peer_ip re-checks the connected address; a missing peer (when require_peer_check, the default) or a non-public
    peer raises FetchRefused.
  - Rejects HTTP >= 400, any content-encoding but identity, types other than text/html, text/plain or application/xhtml+xml,
    and content-length > 20*max_bytes.
  - 'Reads raw bytes and truncates at max_bytes. The client has follow_redirects=False, trust_env=False, no keep-alive
    and accept-encoding: identity.'
  - fetch_page_text wraps the whole fetch in run_with_timeout; httpx, OS and decode errors come back as a generic
    "fetch failed".
  rule: untrusted text
  refs:
  - {file: src/job_copilot/tools/web.py, symbol: _fetch_once, label: _fetch_once()}
  - {file: src/job_copilot/tools/web.py, symbol: fetch_page_text, label: fetch_page_text()}
  - {file: src/job_copilot/tools/web.py, symbol: _peer_ip, label: _peer_ip()}
  - {file: src/job_copilot/tools/web.py, symbol: make_client, label: make_client()}
