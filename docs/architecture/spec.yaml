  label: offer()
  sublabel: park thread, then send
  kind: step
  summary: Called by the daily run for each top posting in the digest. It starts an application thread, lets it
    pause at ask, and only then sends the Telegram message with Draft, Save and Not for me buttons.
  how:
  - 'Thread id is thread_id_for(key): "app-" plus the first 24 hex chars of sha256(posting key), so one posting
    always maps to one thread.'
  - If app.get_state(config).values is already set it returns None, so a posting is never offered twice.
  - Checkpoint first, message second, so a button can never point at a thread that does not exist.
  - If tg.send raises TelegramError, checkpointer.delete_thread(tid) removes the thread and the error propagates;
    run._report logs it and the posting is requeued.
  - buttons() mints one fresh store token per call; each button's callback data is "<token>:<action>".
  refs:
  - {file: src/job_copilot/application.py, symbol: offer, label: offer()}
