- id: app_draft
  label: draft
  sublabel: calls draft subagent
  kind: graph_node
  summary: Runs the tool-less draft subagent on the posting and its research brief, sends the draft as a new Telegram
    message with I applied and Discard buttons, then after_draft routes on the result.
  how:
  - The posting is revalidated with Posting.model_validate and the brief, when present, with CheckedBrief.model_validate.
  - If draft_fn raises, it sends "Couldn't draft this one (<error type>). Try Draft again later." and returns choice
    "draft_failed" instead of raising.
  - Tracker is set to "drafted" before the send, so it never lags a delivered draft.
  - The draft message id is stored under "<tid>:draft"; a TelegramError on that send also returns "draft_failed".
  - 'after_draft: "drafted" goes to ask_after, anything else back to ask.'
