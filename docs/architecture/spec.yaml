nodes:
- id: run_main
  label: Scheduled run
  sublabel: systemd timer -> run.main
  kind: entry
  summary: A systemd timer starts `python -m job_copilot.run` eight times a day as a oneshot service. main() loads
    config and secrets, sets the per-run posting cap and opens the SQLite store.
  how:
  - Timer fires at 08,10,12,14,16,18,20,22:00 Asia/Jerusalem with RandomizedDelaySec=120; the service is killed
    after RuntimeMaxSec=1800.
  - Without --dry-run, a missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID returns exit code 2 before anything is fetched
    or spent.
  - cap = min(--limit or max_postings_per_run, max_postings_per_run), so --limit can lower the cap of 40 but never
    raise it.
  - Secrets come from load_secrets() and are passed explicitly to _run(); the store is always closed in a finally
    block.
  rule: secrets
  refs:
  - {file: src/job_copilot/run.py, symbol: main, label: main()}
  - file: config/config.yaml
    match: 'max_postings_per_run: 40'
    label: 'max_postings_per_run: 40'
- id: preflight
  label: Build before ingest
  sublabel: graph, subagents, delivery
  kind: step
  summary: _run() builds the run graph, the screener and researcher subagents, and (outside a dry run) the Telegram
    client and application graph before ingest marks any posting seen.
  how:
  - build_graph(cfg, build_screener(cfg, secrets, load_profile()), build_researcher(cfg, secrets)[0]) runs first,
    so a bad profile fails before ingest.
  - _delivery() creates Telegram(token, chat_id), the drafter, and the application graph with a SqliteSaver on the
    bot's CHECKPOINTS file.
  - In a dry run, tg and app are None and nothing is delivered.
  - first_run is True until a non-dry run_ingest() has written the 'initialised' meta row.
  refs:
  - {file: src/job_copilot/run.py, symbol: _run, label: _run()}
  - {file: src/job_copilot/run.py, symbol: _delivery, label: _delivery()}
- id: fetch_sources
  label: Fetch sources
  sublabel: ingest, no model calls
  kind: external
  summary: 'default_fetchers() returns the source fetchers in run order: configured company passes first, then Ocean
    of Jobs, then the TechMap CSVs (cached for 6 hours).'
  how:
  - Company passes run first so their wider tagging (roles or 'wide-net') wins the dedupe; the repo default list
    is empty and config.local.yaml can replace it.
  - Ocean of Jobs is queried with israel_only=1, limit=500 and max_age_days 7 on the first run, 2 after.
  - TechMap reads 7 category CSVs; only rows whose title matches a target role are kept, and the result is cached
    in SQLite for 6 hours.
  - Responses are capped (10 MB Ocean, 5 MB per CSV) with a 30 s overall deadline; a redirect to a host other than
    oceanofjobs.com or raw.githubusercontent.com raises FetchError.
  - The httpx client ignores proxy env (trust_env=False), follows at most 3 redirects and uses fetch_timeout_s 15.
  rule: untrusted text
  refs:
  - file: src/job_copilot/ingest/__init__.py
    symbol: default_fetchers
    label: default_fetchers()
  - {file: src/job_copilot/ingest/sources.py, symbol: fetch_bytes, label: fetch_bytes()}
  - {file: src/job_copilot/ingest/sources.py, symbol: make_client, label: make_client()}
  - file: src/job_copilot/ingest/__init__.py
    symbol: _techmap_cached
    label: _techmap_cached()
- id: run_ingest
  label: Filter and dedupe
  sublabel: run_ingest
  kind: step
  summary: run_ingest() puts the pending queue first, adds every source batch, drops excluded or off-role titles
    and already-seen keys, then caps what is reported this run.
  how:
  - One failing source only adds an error string; AllSourcesFailed is raised only when every fetcher failed and
    nothing was collected, pending included (run exits 1).
  - Titles matching EXCLUDE (intern, student, junior, PhD, hardware, chip, SDR, BDR, product marketing...) are skipped.
  - A posting with no roles of its own and no ROLE match (gtm, bizapps, ai) is skipped; AI-only matches on ML/infra
    titles count as no match.
  - Keys in the seen table (pruned after 90 days) or already in this batch are skipped.
  - Outside a dry run, only the reported slice is marked seen; the overflow replaces the pending queue for the next
    run.
  rule: limits
  refs:
  - {file: src/job_copilot/ingest/__init__.py, symbol: run_ingest, label: run_ingest()}
  - {file: src/job_copilot/ingest/filters.py, symbol: role_of, label: role_of()}
  - {file: src/job_copilot/ingest/filters.py, symbol: EXCLUDE, label: EXCLUDE}
  - file: src/job_copilot/ingest/__init__.py
    symbol: SEEN_TTL_DAYS
    label: SEEN_TTL_DAYS = 90
- id: fan_out
  label: fan_out
  sublabel: START edge, Send x N
  kind: router
  summary: The conditional edge from START sends each new posting to its own `screen` task with LangGraph Send,
    so postings are screened in parallel.
  how:
  - 'Returns [Send("screen", {"posting": p})] for state["new"][:max_postings_per_run] (40).'
  - A plain Python function over state; no model picks the next node.
  - run.py invokes the graph with recursion_limit = graph_recursion_limit (60).
  rule: routing is Python
  refs:
  - {file: src/job_copilot/graph.py, symbol: build_graph.fan_out, label: fan_out()}
  - {file: src/job_copilot/graph.py, symbol: build_graph, label: build_graph()}
- id: title_guard
  label: Title deal-breaker
  sublabel: regex, before any model
  kind: guard
  summary: Before the screener runs, title_deal_breaker() checks the title for maternity-cover or contract/temporary
    wording. A match drops the posting with no model call.
  how:
  - '''maternity cover'' matches ''maternity'', ''parental leave cover'' or the Hebrew forms.'
  - '''contract / temporary'' matches contractor, (contract), contract role/position/basis/job, a title starting
    with ''contract'', temporary, temp, freelance or the Hebrew word.'
  - '''contracts'' (plural, as in contracts management) deliberately does not match.'
  - 'On a match, _screen returns route=''drop'' with note ''deal-breaker in title: <name>'' and fit=None.'
  refs:
  - file: src/job_copilot/guards.py
    symbol: title_deal_breaker
    label: title_deal_breaker()
  - {file: src/job_copilot/guards.py, symbol: _DEAL_BREAKERS, label: _DEAL_BREAKERS}
- id: screen
  label: screen
  sublabel: graph node, calls screener
  kind: graph_node
  summary: One task per posting. It wraps _screen() in a LangSmith trace span with a fresh uuid4 run_id, calls the
    screener subagent for a FitScore and maps failures to a safe route.
  how:
  - BudgetExceeded (daily model cap reached) gives route='deferred' with note 'daily model budget reached'.
  - 'Any other screener exception gives route=''digest'' with note ''screener failed: <ExceptionType>'', so one
    failure never sinks the batch.'
  - On success the route comes from route_for(fit, cfg); the run_id is copied onto the result so owner feedback
    can attach to this trace.
  - Results are appended to state['screened'] through an operator.add reducer.
  rule: model output is data
  refs:
  - {file: src/job_copilot/graph.py, symbol: build_graph.screen, label: screen()}
  - {file: src/job_copilot/graph.py, symbol: build_graph._screen, label: _screen()}
  - {file: src/job_copilot/graph.py, symbol: Screened, label: Screened}
- id: route_for
  label: route_for
  sublabel: score -> route
  kind: router
  summary: Plain Python maps a validated FitScore to drop, digest or research. The fourth route, deferred, is set
    only by screen's budget path.
  how:
  - deal_breaker set or score < digest_min (55) gives 'drop'.
  - 'injection_suspected gives ''digest'': shown with a warning, never sent to web research.'
  - score >= research_min (75) gives 'research'; anything else gives 'digest'.
