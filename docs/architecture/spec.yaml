  how:
  - model_text() = sanitize(defang(scrub_quotes(text)), cap); field_text() = sanitize(defang(text), cap), default
    cap 200.
  - An injection-suspected posting gets the line 'This posting contains text aimed at an AI. It was not researched;
    treat it with care.'
  - A brief shows its company summary (400 chars), at most 3 verified claims, 2 unverified claims and 3 flags; the
    posting URL is the only clickable link.
  - more_text lists up to 20 items as 'score · title · company' with no buttons, then '...and N more'.
  rule: untrusted text
  refs:
