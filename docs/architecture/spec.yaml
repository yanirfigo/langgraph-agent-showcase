  sublabel: deliver, link runs, requeue
  kind: step
  summary: _report() links each shown posting to its screening run, sends the summary, the offers and the overflow
    list, and removes each delivered posting from the undelivered set.
  how:
  - Dropped postings are removed from undelivered first, so they stay seen and are not requeued.
  - link_run() stores key, run_id, route, score and the posting for every top and more item so owner feedback reaches
    the right LangSmith run.
  - The summary is sent only if there are top items, deferred items or source errors; a failed summary send is only
    logged.
  - An offer or overflow-list TelegramError is logged and those postings stay undelivered for requeue.
  refs:
  - {file: src/job_copilot/run.py, symbol: _report, label: _report()}
  - {file: src/job_copilot/store.py, symbol: Store.link_run, label: Store.link_run()}
