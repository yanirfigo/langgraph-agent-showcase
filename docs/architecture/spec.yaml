# Interactive architecture map. Built into site/index.html by tools/build_architecture.py and published
# to GitHub Pages by .github/workflows/pages.yml.
#
# nodes: one entry per component. refs name code by file + symbol (dotted Python qualname, e.g.
#   build_graph.collect) or file + match (a literal string found exactly once, for YAML/systemd/shell).
#   Line numbers are resolved at build time; tests/test_architecture_map.py fails if a ref goes stale.
# views: what each tab shows. place maps node id -> [x, y] (top-left, box is 184 x 58). Edge kinds: flow,
#   send, conditional, data, resume, uses. Optional edge keys: label, summary, ref, from_side/to_side
#   (l r t b), from_offset/to_offset (px along that side), bend, label_t (label position along the edge, 0-1).

repo: yanirfigo/langgraph-agent-showcase
title: Job Copilot Architecture Map
intro: '<p>Job Copilot is a production-style LangGraph agent. This map shows its two processes, two graphs, four
  subagents and the guards around them. Every box and every labelled routing edge is linked to the code that implements
  it.</p><ol><li><b>Click a box</b> to see what it does, how it is done, and the exact code, with a link to the
  lines on GitHub.</li><li><b>Click a routing edge</b> (amber, or with a label like <i>Send × N</i>) to see the
  Python function that makes that decision. No model ever picks the next step.</li><li><b>Switch views</b> with
  the tabs. Boxes marked <i>open view</i> zoom into that part.</li><li>Search finds components by name, function
  or file.</li></ol><p>Shapes: a hexagon is a decision made in code, a double border is a model call, a pill with
  a pause sign is an <code>interrupt()</code>, a cylinder is storage, a notched box is a guard, a box with long
  dashes is outside the process, and one with short dashes is a tool the model can call.</p><p>The code locations
  are resolved from the source when the page is built, so the line numbers and snippets always match the commit
  shown in the header.</p>'
