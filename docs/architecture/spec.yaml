  - file: src/job_copilot/timeouts.py
    symbol: run_with_timeout
    label: run_with_timeout()
  - file: src/job_copilot/graph.py
    symbol: build_graph.research
    label: graph research node
  - file: config/config.yaml
    match: 'research_timeout_s: 300'
    label: 'research_timeout_s: 300'
- id: app_ask
  label: ask
  sublabel: 'interrupt: first choice'
  kind: interrupt
  summary: The first pause of every application thread. It only calls interrupt() and waits for the owner's first
    button press.
  how:
  - 'Calls interrupt({"stage": "first", "key": key}); the thread is checkpointed in SQLite and the process can exit.'
  - On resume, the value is kept only if it is one of FIRST = ("draft", "save", "dismiss"); anything else becomes
    "invalid".
  - Has no side effects, so re-running it after a crash is harmless.
