  kind: eval
  summary: Grades the real screener plus route_for against the owner's labels, as LangSmith experiments on fit-labels
    and, if present, fit-labels-live.
  how:
  - Title deal-breakers are checked first, as in production; otherwise the screener scores and route_for picks the
    route.
  - 'Gate: no posting labelled fit is dropped, and research precision >= 0.8 (maybe counts as a miss).'
  - Any errored run also fails the gate; exit 1 on failure, 2 if the LangSmith key is missing.
  - The fit-labels dataset is re-uploaded only when its sha256 content digest changes.
