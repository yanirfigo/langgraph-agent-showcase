- id: bot_main
  label: bot.main()
  sublabel: long-poll loop
  kind: entry
  summary: The Telegram listener process. It builds the application graph, then long-polls getUpdates forever and
    hands each update to handle_update.
  how:
  - Exits with SystemExit if TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing from secrets.
  - 'Starts from store meta "tg_offset" and saves the new offset before handling each update: at-most-once, so a
    crashing update is not retried forever.'
  - A getUpdates TelegramError sleeps 10 s and retries; an exception in one update is logged and the loop continues.
  - Each update runs inside tracing(cfg, secrets, hidden=True), so traces keep structure and timing but not CV or
    draft text.
  rule: secrets
  refs:
  - {file: src/job_copilot/bot.py, symbol: main, label: main()}
- id: bot_handle_update
  label: handle_update()
  sublabel: owner + stage check
  kind: guard
  summary: Validates one Telegram update and, for a button press, resumes the right thread only if the action matches
    what that thread is waiting for.
  how:
  - Drops any update where tg.is_owner(update) is false and returns "ignored".
  - Splits callback data into token and action; an action outside FIRST + AFTER or an unknown token answers "That
    button is no longer valid."
  - recover() first finishes a thread that has a pending node but no interrupt (cut off mid-node); side-effect nodes
    are safe to re-run.
  - _stage() reads the pending interrupt's stage; the action must be in FIRST for "first" or AFTER for "after_draft",
    else "Already handled."
  - 'Text (lowercased): /status or status sends tracker counts; /start, /help or help sends HELP; anything else
    is "unhandled".'
  rule: untrusted text
  refs:
  - {file: src/job_copilot/bot.py, symbol: handle_update, label: handle_update()}
  - {file: src/job_copilot/bot.py, symbol: recover, label: recover()}
  - {file: src/job_copilot/bot.py, symbol: _stage, label: _stage()}
- id: state_store
  label: Store (state.sqlite)
  sublabel: tokens, messages, tracker
  kind: store
  summary: Local SQLite state shared by the run and the bot. For this half it holds button tokens, Telegram message
    ids, the application status tracker and the links from postings to their screening runs.
  how:
  - 'new_token uses secrets.token_urlsafe(12): opaque and unguessable; thread_for maps it back to one thread id.'
  - messages table keeps message ids outside graph state, keyed "<tid>" and "<tid>:draft".
  - set_status upserts the applications row (saved, dismissed, drafted, draft discarded, applied); status_counts
    backs /status.
  - link_run stores run_id, route, score and posting per key; run._report calls it for every top and overflow posting.
  - WAL journal mode and a 10 s connect timeout, because two processes share the file.
  rule: personal data
  refs:
  - {file: src/job_copilot/store.py, symbol: Store.new_token, label: new_token()}
  - {file: src/job_copilot/store.py, symbol: Store.set_status, label: set_status()}
