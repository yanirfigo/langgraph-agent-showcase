  label: Requeue
  sublabel: Store.requeue, SQLite
  kind: store
  summary: Whatever was marked seen but not delivered goes back to the front of the pending queue and is un-marked
    as seen, so no run loses a posting.
  how:
  - 'Normal path: _report requeues what is left in undelivered (deferred items and failed sends), then clears it.'
  - 'Failure path: if _report raises anything, _run requeues all undelivered postings (unless dry run); an Exception
    returns 1, anything else (e.g. KeyboardInterrupt) is re-raised.'
