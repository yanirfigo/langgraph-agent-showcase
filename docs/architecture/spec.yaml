  - The graph's research node uses it with research_timeout_s (300 s) and records "research timed out"; other errors
    are recorded as the type name plus 200 chars.
  - fetch_page_text uses deadline_s + 1 (31 s) and maps a TimeoutError to FetchRefused("page took too long").
  rule: limits
