  - 'Code checks: no links or email addresses in the cover note, CV bullets or gaps, and a cover note of 1-200 words.'
  - 'Judge is the research model with structured JudgeVerdict output: grounded, unsupported claims, tone issues.'
  - 'Gate: every draft grounded, every code check passes, no errored runs. Tone is advisory against an 80% target.'
  - 'make_client(hidden=True): only scores and timings reach LangSmith, never the CV or draft text.'
  rule: evals gate
