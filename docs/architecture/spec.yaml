- id: app_record_dismissed
  label: record_dismissed
  sublabel: side effect, ends thread
  kind: graph_node
  summary: Marks the posting as dismissed and removes the buttons from its message. The thread then ends.
  how:
  - Writes status "dismissed" to the tracker.
  - Calls tg.set_buttons(message, None), which sends an empty inline keyboard.
  - Fixed edge record_dismissed -> END.
