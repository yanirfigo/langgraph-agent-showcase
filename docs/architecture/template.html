<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Copilot Architecture Map</title>
<meta name="description" content="Interactive architecture and data-flow map of the Job Copilot LangGraph agent. Click a component to see its code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-height app. Header with view tabs, then a pan/zoom SVG canvas; a detail panel slides in on
   the right (bottom sheet on phones) with the component's summary, how-it-works bullets and live code. */
:root {
  color-scheme: light;
  --paper: #f2f4f6;
  --canvas: #f7f8fa;
  --dot: #d5dbe1;
  --surface: #ffffff;
  --ink: #15212c;
  --muted: #5b6977;
  --line: #d6dde3;
  --accent: #2b59c3;
  --accent-ink: #ffffff;
  --edge: #8795a3;
  --focus: #e8a33d;
  --code-bg: #f4f6f8;
  --code-hl: #fff3d6;
  --tok-kw: #7a3db8; --tok-str: #1e7a45; --tok-com: #7d8894; --tok-num: #b0521b; --tok-fn: #2b59c3; --tok-dec: #a0306d;
  --k-entry: #4c5a68;  --k-entry-bg: #eef1f4;
  --k-step: #4c5a68;   --k-step-bg: #ffffff;
  --k-graph: #2b59c3;  --k-graph-bg: #e8eefb;
  --k-router: #a86b00; --k-router-bg: #fbf1dc;
  --k-sub: #6c3fc0;    --k-sub-bg: #f0eafb;
  --k-tool: #6c3fc0;   --k-tool-bg: #ffffff;
  --k-guard: #b23a48;  --k-guard-bg: #fbe9eb;
  --k-store: #137a7a;  --k-store-bg: #e2f3f2;
  --k-ext: #5b6977;    --k-ext-bg: #ffffff;
  --k-int: #2f7d32;    --k-int-bg: #e6f3e6;
  --k-eval: #7a6a12;   --k-eval-bg: #f5f1d8;
  --k-ops: #4c5a68;    --k-ops-bg: #edf0f3;
  --k-view: #15212c;   --k-view-bg: #ffffff;
  --group-bg: rgba(255,255,255,.6);
  --group-line: #c9d2da;
  --font-ui: "Hanken Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0f141a; --canvas: #121820; --dot: #222c37; --surface: #18202a; --ink: #e4eaf0; --muted: #98a6b4;
    --line: #2a3542; --accent: #7aa2ff; --accent-ink: #0f141a; --edge: #6b7a8a; --focus: #f0b75a;
    --code-bg: #141b23; --code-hl: #3a3020;
    --tok-kw: #c79bff; --tok-str: #7fd39b; --tok-com: #6f7d8b; --tok-num: #f0a46b; --tok-fn: #8fb0ff; --tok-dec: #f08bbd;
    --k-entry: #a9b6c3; --k-entry-bg: #1d2630; --k-step: #a9b6c3; --k-step-bg: #18202a;
    --k-graph: #8fb0ff; --k-graph-bg: #1a2540; --k-router: #f0c060; --k-router-bg: #33290f;
    --k-sub: #b99bff; --k-sub-bg: #271d3d; --k-tool: #b99bff; --k-tool-bg: #18202a;
    --k-guard: #ff8f9c; --k-guard-bg: #3a1d22; --k-store: #6fd6d0; --k-store-bg: #12302f;
    --k-ext: #a9b6c3; --k-ext-bg: #18202a; --k-int: #86d38a; --k-int-bg: #183019;
    --k-eval: #e0cf6a; --k-eval-bg: #2f2b12; --k-ops: #a9b6c3; --k-ops-bg: #1d2630;
    --k-view: #e4eaf0; --k-view-bg: #1d2630;
    --group-bg: rgba(24,32,42,.6); --group-line: #2c3846;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0f141a; --canvas: #121820; --dot: #222c37; --surface: #18202a; --ink: #e4eaf0; --muted: #98a6b4;
  --line: #2a3542; --accent: #7aa2ff; --accent-ink: #0f141a; --edge: #6b7a8a; --focus: #f0b75a;
  --code-bg: #141b23; --code-hl: #3a3020;
  --tok-kw: #c79bff; --tok-str: #7fd39b; --tok-com: #6f7d8b; --tok-num: #f0a46b; --tok-fn: #8fb0ff; --tok-dec: #f08bbd;
  --k-entry: #a9b6c3; --k-entry-bg: #1d2630; --k-step: #a9b6c3; --k-step-bg: #18202a;
  --k-graph: #8fb0ff; --k-graph-bg: #1a2540; --k-router: #f0c060; --k-router-bg: #33290f;
  --k-sub: #b99bff; --k-sub-bg: #271d3d; --k-tool: #b99bff; --k-tool-bg: #18202a;
  --k-guard: #ff8f9c; --k-guard-bg: #3a1d22; --k-store: #6fd6d0; --k-store-bg: #12302f;
  --k-ext: #a9b6c3; --k-ext-bg: #18202a; --k-int: #86d38a; --k-int-bg: #183019;
  --k-eval: #e0cf6a; --k-eval-bg: #2f2b12; --k-ops: #a9b6c3; --k-ops-bg: #1d2630;
  --k-view: #e4eaf0; --k-view-bg: #1d2630;
  --group-bg: rgba(24,32,42,.6); --group-line: #2c3846;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
  display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden;
}
a { color: var(--accent); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* header */
.top {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px;
  padding-block: calc(10px + env(safe-area-inset-top, 0px)) 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
.brand { display: grid; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.brand .meta { color: var(--muted); font-size: 12.5px; }
.brand .meta code { font-family: var(--font-code); font-size: 11.5px; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.search { position: relative; }
.search input {
  width: 220px; max-width: 60vw; padding: 6px 10px 6px 30px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--canvas);
}
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--muted); fill: none; }
.btn {
  border: 1px solid var(--line); background: var(--canvas); border-radius: 8px; padding: 5px 10px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.repo-link { font-weight: 600; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.repo-link svg { width: 16px; height: 16px; fill: currentColor; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: transparent; padding: 7px 12px 8px; cursor: pointer; white-space: nowrap;
  color: var(--muted); font-weight: 600; border-bottom: 2.5px solid transparent;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* main */
.main { position: relative; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--canvas); touch-action: none; }
.stage svg.map { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; -webkit-user-select: none; }
.stage svg.map.dragging { cursor: grabbing; }
.caption {
  position: absolute; top: 12px; left: calc(12px + env(safe-area-inset-left, 0px)); right: 64px; z-index: 2; pointer-events: none;
  color: var(--muted); font-size: 13px; max-width: 70ch;
}
.caption b { color: var(--ink); }
.zoom {
  position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 4px; z-index: 2;
}
.zoom .btn { width: 34px; height: 34px; justify-content: center; padding: 0; background: var(--surface); font-weight: 600; }
.legend {
  position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; z-index: 2;
  max-width: calc(100% - 80px);
}
.legend[open] .rows { display: grid; grid-template-columns: repeat(2, auto); gap: 4px 14px; margin-top: 6px; }
.legend .row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend .sw { width: 14px; height: 10px; border-radius: 3px; border: 1.5px solid; flex: none; }
.legend .ln { width: 22px; height: 0; border-top: 2px solid var(--edge); flex: none; }
.legend summary { cursor: pointer; font-weight: 600; }

/* svg content */
.grp rect { fill: var(--group-bg); stroke: var(--group-line); stroke-width: 1.2; stroke-dasharray: 5 4; }
.grp text { fill: var(--ink); font: 600 13px var(--font-ui); letter-spacing: .01em; }
.grp text.sub { fill: var(--muted); font: 400 11.5px var(--font-ui); letter-spacing: 0; }
.edge path.line { fill: none; stroke: var(--edge); stroke-width: 1.6; }
.edge.send path.line { stroke-dasharray: 7 4; }
.edge.data path.line { stroke-dasharray: 2 4; stroke-linecap: round; }
.edge.uses path.line { stroke-dasharray: 1 5; stroke-linecap: round; stroke-width: 1.5; }
.edge.resume path.line { stroke: var(--k-int); stroke-width: 2; }
.edge.conditional path.line { stroke: var(--k-router); }
.edge path.hit { fill: none; stroke: transparent; stroke-width: 14; }
.edge.clickable { cursor: pointer; }
.edge.clickable:hover path.line { stroke-width: 2.6; }
.edge text { font: 500 11px var(--font-ui); fill: var(--muted); }
.edge.clickable text { fill: var(--ink); text-decoration: underline; text-decoration-color: var(--edge); }
.edge rect.lbl { fill: var(--canvas); }
.node { cursor: pointer; }
.node .shape { stroke-width: 1.6; }
.node text.label { font: 600 12.5px var(--font-code); fill: var(--ink); }
.node text.sub { font: 400 11px var(--font-ui); fill: var(--muted); }
.node:hover .shape, .node:focus-visible .shape { stroke-width: 2.6; }
.node:focus { outline: none; }
.node:focus-visible .shape { stroke: var(--focus); }
.node.sel .shape { stroke: var(--focus); stroke-width: 3; }
.node.match .shape { stroke: var(--focus); stroke-width: 2.6; }
.node.view text.label { font: 700 13.5px var(--font-ui); }
.dim { opacity: .18; transition: opacity .15s; }
.hl path.line { stroke: var(--focus) !important; stroke-width: 2.4; opacity: 1; }
.hl text { fill: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .dim { transition: none; } }

/* detail panel */
.panel {
  width: min(560px, 46vw); border-left: 1px solid var(--line); background: var(--surface);
  overflow-y: auto; overscroll-behavior: contain; min-width: 0;
  padding-block: 18px calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: 22px; padding-right: max(22px, env(safe-area-inset-right, 0px));
}
.panel[hidden] { display: none !important; }
.panel-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 2px 9px; border: 1.5px solid var(--line); color: var(--muted); }
.panel h2 { margin: 6px 0 4px; font: 600 20px var(--font-code); letter-spacing: -.01em; overflow-wrap: anywhere; text-wrap: balance; }
.panel .sub { color: var(--muted); margin: 0; }
.panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 22px 0 8px; }
.panel p.summary { font-size: 15px; margin: 12px 0 0; max-width: 62ch; }
.panel ul.how { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 64ch; }
.rule { margin-top: 14px; display: flex; gap: 8px; align-items: baseline; font-size: 13px; background: var(--code-bg); border-radius: 8px; padding: 8px 12px; }
.rule b { white-space: nowrap; }
.go { margin-top: 14px; }
.go .btn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.close { border: 0; background: transparent; cursor: pointer; padding: 4px; border-radius: 6px; color: var(--muted); }
.close:hover { color: var(--ink); background: var(--code-bg); }
.close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
.ref { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
.ref-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; padding: 8px 12px; background: var(--code-bg); border-bottom: 1px solid var(--line); }
.ref-head .name { font: 600 13px var(--font-code); overflow-wrap: anywhere; }
.ref-head .where { font: 400 12px var(--font-code); color: var(--muted); overflow-wrap: anywhere; }
.ref-head a { font-weight: 600; font-size: 12.5px; white-space: nowrap; text-decoration: none; }
.ref-head a:hover { text-decoration: underline; }
pre.code { margin: 0; overflow: auto; max-height: 420px; font: 12px/1.55 var(--font-code); background: var(--surface); padding: 6px 0; tab-size: 4; }
pre.code .ln { display: block; padding: 0 12px 0 0; white-space: pre; min-width: max-content; }
pre.code .ln::before { content: attr(data-n); display: inline-block; width: 3.6em; padding-right: 12px; text-align: right; color: var(--tok-com); user-select: none; }
pre.code .ln.focus { background: var(--code-hl); }
pre.code .more { display: block; padding: 4px 12px 2px 4.6em; color: var(--muted); font-style: italic; }
.t-kw { color: var(--tok-kw); } .t-str { color: var(--tok-str); } .t-com { color: var(--tok-com); font-style: italic; }
.t-num { color: var(--tok-num); } .t-fn { color: var(--tok-fn); font-weight: 600; } .t-dec { color: var(--tok-dec); } .t-key { color: var(--tok-fn); }
.links { display: grid; gap: 6px; }
.links button { text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 10px; cursor: pointer; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.links button:hover { border-color: var(--accent); }
.links .dir { color: var(--muted); font-size: 12px; min-width: 3.2em; }
.links .to { font: 600 12.5px var(--font-code); }
.links .why { color: var(--muted); font-size: 12.5px; }
.intro { max-width: 62ch; }
.intro p { margin: 10px 0 0; }
.intro ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.intro code { font-family: var(--font-code); font-size: 12px; }

@media (max-width: 760px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .panel {
    position: absolute; left: 0; right: 0; bottom: 0; width: auto; max-height: 64%; z-index: 5;
    border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .tools { margin-left: 0; width: 100%; flex-wrap: nowrap; }
  .search { flex: 1; min-width: 0; }
  .search input { width: 100%; max-width: none; }
  .legend { display: none; }
  .caption { display: none; }
  #about span { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">
      <h1 id="title">Architecture map</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="tools">
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Find a component or function" autocomplete="off" aria-label="Find a component or function">
      </label>
      <button class="btn" id="about" type="button">? <span>How to read this</span></button>
      <a class="repo-link" id="repo" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>Code</span>
      </a>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
</header>
<div class="main">
  <div class="stage" id="stage">
    <div class="caption" id="caption"></div>
    <svg class="map" id="map" role="group" aria-labelledby="title">
      <defs id="defs"></defs>
      <g id="viewport"></g>
    </svg>
    <details class="legend" id="legend"><summary>Legend</summary><div class="rows" id="legend-rows"></div></details>
    <div class="zoom">
      <button class="btn" id="zin" type="button" aria-label="Zoom in">+</button>
      <button class="btn" id="zout" type="button" aria-label="Zoom out">−</button>
      <button class="btn" id="zfit" type="button" aria-label="Fit to screen" title="Fit to screen">⤢</button>
    </div>
  </div>
  <aside class="panel" id="panel" hidden aria-live="polite"></aside>
</div>

<script>
const DATA = /*__DATA__*/null;
(() => {
  const SVGNS = "http://www.w3.org/2000/svg";
  const KIND = {
    view:       { name: "Opens a view",          v: "view" },
    entry:      { name: "Entry point",           v: "entry" },
    step:       { name: "Plain Python step",     v: "step" },
    graph_node: { name: "LangGraph node",        v: "graph" },
    router:     { name: "Decision in code",      v: "router" },
    subagent:   { name: "Model call",            v: "sub" },
    tool:       { name: "Tool the model can call", v: "tool" },
    guard:      { name: "Guard / check",         v: "guard" },
    interrupt:  { name: "Human pause",           v: "int" },
    store:      { name: "Storage",               v: "store" },
    external:   { name: "Outside the process",   v: "ext" },
    eval:       { name: "Eval",                  v: "eval" },
    ops:        { name: "Operations",            v: "ops" },
  };
  const EDGE = {
    flow: "Control flow", send: "Fan-out (Send)", conditional: "Conditional edge (Python)",
    data: "Data handed over", resume: "Human resumes", uses: "Calls / uses",
  };
  const W = 184, H = 58;
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, parent) => {
    const n = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (parent) parent.appendChild(n);
    return n;
  };
  const h = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  };
  const kv = (k) => `var(--k-${(KIND[k] || KIND.ops).v})`;
  const kbg = (k) => `var(--k-${(KIND[k] || KIND.ops).v}-bg)`;
  const NODES = new Map(DATA.nodes.map((n) => [n.id, n]));
  const VIEWS = new Map(DATA.views.map((v) => [v.id, v]));
  const viewsOf = (id) => DATA.views.filter((v) => v.place[id]);

  // ---------- header ----------
  $("title").textContent = DATA.title;
  document.title = DATA.title;
  $("repo").href = `https://github.com/${DATA.repo}`;
  const shortRef = /^[0-9a-f]{40}$/.test(DATA.ref) ? DATA.ref.slice(0, 7) : DATA.ref;
  const refLink = h("a", { href: `https://github.com/${DATA.repo}/tree/${DATA.ref}`, target: "_blank", rel: "noopener" }, h("code", { text: shortRef }));

    return c;
  }
  function openPanel(children) {
    panel.replaceChildren(...children); panel.hidden = false; panel.scrollTop = 0;
    requestAnimationFrame(() => { const r = svg.getBoundingClientRect(); void r; });
  }
  function setHash(s) { try { history.replaceState(null, "", s ? `#${s}` : location.pathname + location.search); } catch { /* sandboxed */ } }

  function activate(id, byKeyboard = false) {
    const n = NODES.get(id);
    if (n.kind === "view") { // the clicked box is replaced by a new view: keep keyboard focus somewhere real
      show(n.view, { panelFor: id });
      if (byKeyboard) tabs.querySelector(`[data-view="${n.view}"]`)?.focus();
      return;
    }
    select(id);
  }
  function nodePanel(n) {
    const kids = [h("div", { class: "panel-head" }, chip((KIND[n.kind] || KIND.ops).name, kv(n.kind), kbg(n.kind)), closeBtn()), h("h2", { text: n.label })];
    if (n.sublabel) kids.push(h("p", { class: "sub", text: n.sublabel }));
    kids.push(h("p", { class: "summary", text: n.summary }));
    if (n.rule) kids.push(h("div", { class: "rule" }, h("b", { text: "Design rule" }), h("span", { text: n.rule })));
    if (n.kind === "view" && cur.id !== n.view) {
      const b = h("button", { class: "btn", type: "button", text: `Open the ${VIEWS.get(n.view).label} view →` });
      b.onclick = () => show(n.view);
      kids.push(h("div", { class: "go" }, b));
    }
    if (n.how && n.how.length) { kids.push(h("h3", { text: "How it works" })); kids.push(h("ul", { class: "how" }, ...n.how.map((t) => h("li", { text: t })))); }
    if (n.refs.length) { kids.push(h("h3", { text: "Where it lives in the code" })); n.refs.forEach((r) => kids.push(refCard(r))); }
    const links = [];
    cur.edges.forEach((e, i) => {
      if (e.from !== n.id && e.to !== n.id) return;
      const out = e.from === n.id, other = NODES.get(out ? e.to : e.from);
      const b = h("button", { type: "button" }, h("span", { class: "dir", text: out ? "to →" : "← from" }), h("span", { class: "to", text: other.label }), e.label ? h("span", { class: "why", text: e.label }) : null);
      b.onclick = () => ((e.ref || e.summary) ? showEdge(i) : select(other.id));
      links.push(b);
    });
    if (links.length) { kids.push(h("h3", { text: "Connected in this view" })); kids.push(h("div", { class: "links" }, ...links)); }
    const elsewhere = viewsOf(n.id).filter((v) => v.id !== cur.id);
    if (elsewhere.length) {
      kids.push(h("h3", { text: "Also shown in" }));
      kids.push(h("div", { class: "links" }, ...elsewhere.map((v) => {
        const b = h("button", { type: "button" }, h("span", { class: "dir", text: "view" }), h("span", { class: "to", text: v.label }));
        b.onclick = () => show(v.id, { select: n.id });
        return b;
      })));
    }
    return kids;
  }
  function select(id) {
    const n = NODES.get(id); if (!n || !pos.has(id)) return;
    selState = { node: id };
    focusNode(id);
    openPanel(nodePanel(n));
    setHash(`${cur.id}.${id}`);
    requestAnimationFrame(() => centerOn(id)); // after the panel has taken its space
  }
  function showEdge(i) {
    const e = cur.edges[i];
    const a = NODES.get(e.from), b = NODES.get(e.to);
    selState = { edge: i };
    markEdge(i);
    setHash(cur.id === DATA.views[0].id ? "" : cur.id); // edges have no deep link; don't keep a node's
    const kind = e.kind || "flow";
    const color = kind === "conditional" ? "var(--k-router)" : kind === "resume" ? "var(--k-int)" : null;
    const kids = [h("div", { class: "panel-head" }, chip(EDGE[kind], color), closeBtn()), h("h2", { text: `${a.label} → ${b.label}` })];
    if (e.label) kids.push(h("p", { class: "sub", text: `Edge label: ${e.label}` }));
    if (e.summary) kids.push(h("p", { class: "summary", text: e.summary }));
    if (e.ref) { kids.push(h("h3", { text: "Where the decision is made" })); kids.push(refCard(e.ref)); }
    const ba = h("button", { type: "button" }, h("span", { class: "dir", text: "from" }), h("span", { class: "to", text: a.label }));
    ba.onclick = () => select(a.id);
    const bb = h("button", { type: "button" }, h("span", { class: "dir", text: "to" }), h("span", { class: "to", text: b.label }));
    bb.onclick = () => select(b.id);
    kids.push(h("h3", { text: "Ends" }), h("div", { class: "links" }, ba, bb));
    openPanel(kids);
  }
  function clearSel() {
    selState = null; clearHl(); panel.hidden = true;
    setHash(cur.id === DATA.views[0].id ? "" : cur.id);
    if (q.value) q.dispatchEvent(new Event("input"));
  }
  function showIntro() {
    selState = null; clearHl();
    if (q.value) q.dispatchEvent(new Event("input"));
    const div = h("div", { class: "intro" });
    div.innerHTML = DATA.intro;
    openPanel([h("div", { class: "panel-head" }, chip("Guide"), closeBtn()), h("h2", { text: "How to read this map" }), div]);
  }
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !panel.hidden && document.activeElement !== q) clearSel(); });
  $("about").onclick = showIntro;

  function show(viewId, { select: sel = null, panelFor = null } = {}) {
    const v = VIEWS.get(viewId) || DATA.views[0];
    render(v);
    panel.hidden = true;
    selState = sel && pos.has(sel) ? { node: sel } : null;
    if (sel && pos.has(sel)) { focusNode(sel); openPanel(nodePanel(NODES.get(sel))); setHash(`${v.id}.${sel}`); }
    else if (panelFor) { openPanel(nodePanel(NODES.get(panelFor))); setHash(v.id); }
    else setHash(v.id === DATA.views[0].id ? "" : v.id);
    requestAnimationFrame(() => { fit(); if (sel && pos.has(sel)) centerOn(sel); }); // fit to the space left by the panel
  }

  // ---------- search (across all views) ----------
  const q = $("q");
  const hay = new Map(DATA.nodes.map((n) => [n.id, [n.label, n.sublabel, n.summary, ...(n.how || []), ...n.refs.map((r) => `${r.file} ${r.symbol} ${r.label}`)].join(" ").toLowerCase()]));
  q.addEventListener("input", () => {
    if (!cur) return;
    const s = q.value.trim().toLowerCase();
    nodeEls.forEach((g, id) => g.classList.toggle("match", !!s && hay.get(id).includes(s)));
    if (!s) { reapplySel(); return; } // back to whatever the panel is showing
    nodeEls.forEach((g, id) => g.classList.toggle("dim", !hay.get(id).includes(s)));
    edgeEls.forEach((_, i) => mark(i, "dim", true));
  });
  q.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") {
      const s = q.value.trim().toLowerCase(); if (!s) return;
      const rank = (n) => (n.label.toLowerCase().includes(s) ? 0 : 1) + (pos.has(n.id) ? 0 : 2);
      const hits = DATA.nodes.filter((n) => hay.get(n.id).includes(s)).sort((a, b) => rank(a) - rank(b));
      if (!hits.length) return;
      const n = hits[0];
      q.value = "";
      if (pos.has(n.id)) { q.dispatchEvent(new Event("input")); select(n.id); }
      else show((viewsOf(n.id)[0] || DATA.views[0]).id, { select: n.id });
    }
    if (ev.key === "Escape") { q.value = ""; q.dispatchEvent(new Event("input")); }
  });

  // ---------- boot ----------
  function fromHash() { // #view, #view.node or #node
    let raw = "";
    try { raw = decodeURIComponent(location.hash.slice(1)); } catch { /* malformed link: show the first view */ }
    const [hv, hn] = raw.split(".");
    if (hv && !VIEWS.has(hv) && NODES.has(hv)) show(viewsOf(hv)[0].id, { select: hv });
    else show(VIEWS.has(hv) ? hv : DATA.views[0].id, { select: hn || null });
  }
  apply();
  window.addEventListener("hashchange", fromHash); // replaceState in setHash does not fire this
  fromHash();
})();
</script>
</body>
</html>
