[project]
name = "job-copilot"
version = "0.1.0"
description = "LangGraph agent showcase: a job-postings copilot with code-routed subagents, evals and guardrails"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langchain>=1.4.5,<2",
    "langgraph>=1.2.15,<1.3",
    "langchain-anthropic>=1.7.6,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langsmith>=0.14.8,<1",
    "pydantic>=2.14,<3",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6,<7",
    "httpx>=0.28,<1",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tools/label_page.py" = ["E501"]  # embedded single-file HTML template
"tests/*" = ["S104"]  # tests feed 0.0.0.0 to the SSRF guard on purpose
